<section id="contact" class="py-16">
  <div class="container mx-auto px-4">

    {{ with .data.title }}
      <h1 class="text-primary mb-8 text-center text-6xl font-bold">{{ . }}</h1>
    {{ end }}

    <form action="https://api.web3forms.com/submit" method="POST">
      {{ with .data.access_key }}
        <input type="hidden" name="access_key" value="{{ . }}">
      {{ end }}

      <div class="mb-8 flex items-start justify-center">
        <label for="name" class="mb-2 mr-4 whitespace-nowrap text-left w-24">
          <h3 class="text-primary mb-4 text-center text-2xl">Name</h3>
        </label>
        <input type="text" name="name" required class="w-full max-w-md px-3 py-2 border rounded text-left" />
      </div>
      <div class="mb-8 flex items-start justify-center">
        <label for="email" class="mb-2 mr-4 whitespace-nowrap text-left w-24">
          <h3 class="text-primary mb-4 text-center text-2xl">Email</h3>
        </label>
        <input type="email" name="email" required class="w-full max-w-md px-3 py-2 border rounded text-left" />
      </div>
      <div class="mb-8 flex items-start justify-center">
        <label for="message" class="mb-2 mr-4 whitespace-nowrap text-left w-24">
          <h3 class="text-primary mb-4 text-center text-2xl">Message</h3>
        </label>
        <textarea name="message" required class="w-full max-w-md px-3 py-2 border rounded text-left"></textarea>
      </div>
      <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

      {{ with .data.button }}
      <p>{{ $.Site }}</p>
      <input type="hidden" name="redirect" value="{{ $.site.BaseURL }}{{ .link }}">
        <div class="flex items-center justify-center">
          <button type="submit" class="border-primary text-primary hover:bg-primary flex items-center gap-2 rounded border px-8 py-2 duration-500 hover:text-white">
            {{ .label }}
          </button>
        </div>
      {{ end }}
    </form>

  </div>
</section>
