<section id="contact" class="py-16">
  <div class="container mx-auto px-4">

    {{ with .data.title }}
      <h2 class="text-primary mb-8 text-center text-6xl font-bold">{{ . }}</h2>
    {{ end }}
    {{ with .data.text }}
      <p class="mx-auto mb-16 text-center xl:max-w-[50%]">{{ . }}</p>
    {{ end }}

    <form action="https://api.web3forms.com/submit" method="POST">
      {{ with .data.access_key }}
        <input type="hidden" name="access_key" value="{{ . }}">
      {{ end }}
      <input type="hidden" name="subject" value="New class booking request">

      <div class="mb-8 flex items-start justify-center">
        <label for="contact-name" class="text-primary mb-2 mr-4 w-24 whitespace-nowrap text-left text-2xl">Name</label>
        <input type="text" id="contact-name" name="name" autocomplete="name" required class="w-full max-w-md px-3 py-2 border rounded text-left" />
      </div>
      <div class="mb-8 flex items-start justify-center">
        <label for="contact-email" class="text-primary mb-2 mr-4 w-24 whitespace-nowrap text-left text-2xl">Email</label>
        <input type="email" id="contact-email" name="email" autocomplete="email" required class="w-full max-w-md px-3 py-2 border rounded text-left" />
      </div>
      <div class="mb-8 flex items-start justify-center">
        <label for="contact-age" class="text-primary mb-2 mr-4 w-24 whitespace-nowrap text-left text-2xl">Age</label>
        <input type="number" id="contact-age" name="child_age" min="3" max="16" placeholder="Your child's age" required class="w-full max-w-md px-3 py-2 border rounded text-left" />
      </div>
      <div class="mb-8 flex items-start justify-center">
        <label for="contact-class" class="text-primary mb-2 mr-4 w-24 whitespace-nowrap text-left text-2xl">Class</label>
        <select id="contact-class" name="class" required class="w-full max-w-md px-3 py-2 border rounded text-left">
          <option value="">Choose an option</option>
          <option>Single class ($60)</option>
          <option>Workshop, 4 classes ($200)</option>
          <option>Not sure yet</option>
        </select>
      </div>
      <div class="mb-8 flex items-start justify-center">
        <label for="contact-allergies" class="text-primary mb-2 mr-4 w-24 whitespace-nowrap text-left text-2xl">Allergies</label>
        <input type="text" id="contact-allergies" name="allergies" placeholder="Any allergies or dietary needs? (or &quot;none&quot;)" class="w-full max-w-md px-3 py-2 border rounded text-left" />
      </div>
      <div class="mb-8 flex items-start justify-center">
        <label for="contact-message" class="text-primary mb-2 mr-4 w-24 whitespace-nowrap text-left text-2xl">Notes</label>
        <textarea id="contact-message" name="message" autocomplete="off" placeholder="Preferred day(s), questions, anything else" rows="4" class="w-full max-w-md px-3 py-2 border rounded text-left"></textarea>
      </div>
      <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

      {{ with .data.button }}
      <input type="hidden" name="redirect" value="{{ .link | absURL }}">
        <div class="flex items-center justify-center">
          <button type="submit" class="border-primary text-primary hover:bg-primary flex items-center gap-2 rounded border px-8 py-2 duration-500 hover:text-white">
            {{ .label }}
          </button>
        </div>
      {{ end }}
    </form>

  </div>
</section>
